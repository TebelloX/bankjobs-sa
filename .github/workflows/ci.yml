name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site's typecheck imports the generated data snapshots
      # (site/src/data/jobs-full.json + site/public/data/*.json), which are
      # gitignored — produce them from the committed fixtures first. Offline,
      # fast, and doubles as an end-to-end pipeline smoke test.
      - name: Generate site data snapshots from fixtures
        run: pnpm ingest -- --fixtures

      - run: pnpm typecheck

      - run: pnpm test
